name = "wakanda-publish"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Free workers.dev subdomain + preview URLs
workers_dev = true
preview_urls = true

# Secrets (set via CLI — never commit):
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put CLOUDINARY_CLOUD_NAME
#   npx wrangler secret put CLOUDINARY_API_KEY
#   npx wrangler secret put CLOUDINARY_API_SECRET
#
# Optional vars (can also be secrets):
#   CLOUDINARY_FOLDER = wakanda-training
#   CATALOG_PUBLIC_ID = wakanda-training/catalog
